services:
  medrag-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      MEDRAG_DATABASE_URL: sqlite:////app/data/sqlite/medrag.db
      MEDRAG_STORAGE_DIR: /app/data/storage
      MEDRAG_CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - ./data:/app/data
      - ./examples:/app/examples:ro

  medrag-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - medrag-api
